name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
    env:
      AKB_DISTILLER_AUTOSTART: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Isolated tests
        run: python scripts/run_tests.py
      - name: Retrieval benchmark
        run: python scripts/retrieval_benchmark.py
      - name: Lifecycle adapter receipts
        run: python scripts/validate_lifecycle.py
      - name: Build and inspect wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python scripts/check_distribution.py
          python -m pip install --no-deps dist/*.whl
          cd ${{ runner.temp }}
          akb status
          akb --help
